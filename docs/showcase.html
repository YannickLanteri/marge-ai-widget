<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marge AI Widget showcase</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% -15%, #25314b 0, transparent 38%),
        linear-gradient(145deg, #05070c 0%, #0c111c 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .device {
      position: relative;
      width: 1720px;
      height: 1020px;
      padding: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 42px;
      background: linear-gradient(145deg, #242a35, #05070b 45%, #151922);
      box-shadow:
        0 46px 120px rgba(0, 0, 0, 0.62),
        inset 0 1px rgba(255, 255, 255, 0.18),
        inset 0 -1px rgba(255, 255, 255, 0.04);
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 25px;
      background:
        radial-gradient(ellipse at 22% 78%, rgba(255, 95, 58, 0.62), transparent 28%),
        radial-gradient(ellipse at 38% 58%, rgba(154, 72, 255, 0.55), transparent 32%),
        radial-gradient(ellipse at 76% 28%, rgba(37, 198, 255, 0.46), transparent 32%),
        linear-gradient(135deg, #08111d 0%, #111529 40%, #090c15 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(26px);
      opacity: 0.7;
      transform: rotate(-22deg);
    }
    .screen::before {
      left: -8%;
      bottom: 7%;
      width: 760px;
      height: 230px;
      background: linear-gradient(90deg, #ff7149, #aa55ff 68%, transparent);
    }
    .screen::after {
      top: 9%;
      right: -6%;
      width: 700px;
      height: 180px;
      background: linear-gradient(90deg, transparent, #43bdf0 48%, #6889ff);
    }
    .menubar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 2;
      height: 34px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(7, 10, 17, 0.36);
      backdrop-filter: blur(18px);
    }
    .camera {
      position: absolute;
      z-index: 4;
      top: 27px;
      left: 50%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #05070b;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.035);
    }
    .status {
      position: absolute;
      z-index: 3;
      top: 12px;
      right: 18px;
      display: flex;
      gap: 9px;
      align-items: center;
    }
    .status i {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 12px 0 rgba(255, 255, 255, 0.48), 24px 0 rgba(255, 255, 255, 0.26);
    }
    .hero-widget {
      position: absolute;
      z-index: 5;
      top: 4px;
      right: 0;
      width: 1150px;
      height: auto;
      filter: drop-shadow(0 28px 45px rgba(0, 0, 0, 0.42));
    }
    .settings-window {
      position: absolute;
      z-index: 5;
      top: 47px;
      left: 50%;
      height: 885px;
      width: auto;
      border-radius: 18px;
      transform: translateX(-50%);
      box-shadow: 0 35px 85px rgba(0, 0, 0, 0.52);
    }
    [data-scene="hero"] .settings-window,
    [data-scene="settings"] .hero-widget { display: none; }
  </style>
</head>
<body>
  <main class="device" aria-label="Fictional neutral desktop showcase">
    <section class="screen">
      <div class="menubar"></div>
      <div class="camera"></div>
      <div class="status"><i></i></div>
      <img class="hero-widget" src="widget.png" alt="Marge AI Widget in demo mode">
      <img class="settings-window" src="settings.png" alt="Marge AI Widget settings in demo mode">
    </section>
  </main>
  <script>
    const scene = new URLSearchParams(location.search).get('scene');
    document.documentElement.dataset.scene = scene === 'settings' ? 'settings' : 'hero';
  </script>
</body>
</html>
