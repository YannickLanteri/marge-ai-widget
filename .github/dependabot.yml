version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /install/runtime
    schedule:
      interval: weekly
      timezone: Europe/Paris
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
