name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh uninstall.sh bin/marge bin/run-widget

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm audit --audit-level=high
      - run: npm audit --prefix install/runtime --audit-level=high

  electron-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run electron:ensure
      - name: Capture the real widget on macOS
        if: runner.os == 'macOS'
        run: MARGE_CONFIG_DIR="$RUNNER_TEMP/widget-profile" MARGE_DEMO=1 MARGE_CAPTURE="$RUNNER_TEMP/widget.png" npm run demo
      - name: Capture the real settings window on macOS
        if: runner.os == 'macOS'
        run: MARGE_CONFIG_DIR="$RUNNER_TEMP/settings-profile" MARGE_DEMO=1 MARGE_CAPTURE="$RUNNER_TEMP/settings.png" MARGE_CAPTURE_SETTINGS=1 npm run demo
      - name: Verify the real widget on Linux X11
        if: runner.os == 'Linux'
        run: xvfb-run -a env MARGE_CONFIG_DIR="$RUNNER_TEMP/widget-profile" MARGE_DEMO=1 MARGE_CAPTURE="$RUNNER_TEMP/widget.json" MARGE_CAPTURE_VERIFY_ONLY=1 npm run demo -- --no-sandbox
      - name: Verify the real settings window on Linux X11
        if: runner.os == 'Linux'
        run: xvfb-run -a env MARGE_CONFIG_DIR="$RUNNER_TEMP/settings-profile" MARGE_DEMO=1 MARGE_CAPTURE="$RUNNER_TEMP/settings.json" MARGE_CAPTURE_SETTINGS=1 MARGE_CAPTURE_VERIFY_ONLY=1 npm run demo -- --no-sandbox
      - name: Validate smoke artifacts
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            test -s "$RUNNER_TEMP/widget.json"
            test -s "$RUNNER_TEMP/settings.json"
          else
            test -s "$RUNNER_TEMP/widget.png"
            test -s "$RUNNER_TEMP/settings.png"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-smoke-artifacts-${{ runner.os }}
          path: |
            ${{ runner.temp }}/widget.*
            ${{ runner.temp }}/settings.*
          if-no-files-found: error
